# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  date:
    formats:
      long: "%B %-d, %Y"
  time:
    formats:
      long: "%B %-d, %Y %H:%M %Z"
  invoices:
    statuses:
      draft: "Draft"
      pending: "Pending approval"
      approved: "Approved (not paid)"
      rejected: "Rejected"
    empty:
      filtered: "No %{status} invoices to show."
      requester: "You have no invoices yet."
      reviewer: "No submitted invoices yet. Drafts stay private to the requester who wrote them; invoices appear here once submitted."
    drafts:
      saved: "Draft saved. Only you can see it until you submit it for approval."
      discarded: "Draft for %{vendor} discarded."
      conflict: "Not saved: this draft changed since you opened it (for example in another tab). These are its current values at version %{version}; nothing was overwritten."
  activerecord:
    errors:
      models:
        invoice:
          attributes:
            amount:
              invalid_amount: "must be a number of 0 or more with at most %{decimals} decimal places for %{currency}, up to %{max}"
  approvals:
    actions:
      submit: "Submitted"
      approve: "Approved"
      reject: "Rejected"
    outcomes:
      applied:
        approve: "Invoice approved. This records the decision only; it does not pay the invoice."
        reject: "Invoice rejected."
        submit: "Invoice submitted for approval. Approvers in your company can now see it."
      replayed: "Already recorded: this decision was saved at %{time}. Nothing was applied twice."
      conflict: "Not applied: this invoice changed since you opened it. It is now %{status} (version %{version}), last changed by %{actor} at %{time}."
      conflict_without_event: "Not applied: this invoice changed since you opened it. It is now %{status} (version %{version})."
      forbidden: "Not allowed: you can't make this decision on this invoice. Nothing was changed."
      invalid: "Not applied: check the form and try again."
      reused_key: "Not applied: this form was already used for a different decision. Reload the invoice to see its current state."
      # Submit-specific wording; any key missing here falls back to the shared one above.
      submit:
        replayed: "Already recorded: this invoice was submitted at %{time}. Nothing was applied twice."
        forbidden: "Not allowed: only the requester who wrote this draft can submit it. Nothing was changed."
        reused_key: "Not applied: this form was already used for a different action. Reload the invoice to see its current state."
    errors:
      reason:
        blank: "Enter a reason for the rejection."
        too_long: "Keep the reason to 1000 characters or fewer."
