# Render Blueprint for the hosted preview (free tier). Create with Render -> New -> Blueprint.
# Secrets are declared with `sync: false` and entered in the dashboard; no value lives in this file.
databases:
  - name: workbench-db
    plan: free
    postgresMajorVersion: "18"

services:
  - type: web
    name: workbench
    runtime: docker
    plan: free
    healthCheckPath: /up
    # No dockerCommand: the image's own CMD (./bin/rails server) runs through its ENTRYPOINT, which migrates and seeds.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workbench-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
